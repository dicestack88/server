config_version: 3

brand: "<gradient:blue:aqua>KitsByPriyme</gradient>"

updates:
  enabled: true
  modrinth_project: "kitsbypriyme"
  notify_ops_on_join: true
  check_interval_minutes: 60
  timeout_seconds: 5
  include_loaders:
    - paper
    - spigot
    - bukkit
  game_versions: []

gui:
  title: "<gray>Kits"
  size_rows: 3
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: []
  lore_template:
    - "{description}"
    - ""
    - "<white>Rarity: <yellow>{rarity}"
    - "<white>Cooldown: <aqua>{cooldown}"
    - ""
    - "<gray>Gain access to this kit"
    - "<gray>by having the <bold><blue>{rank}</blue></bold> rank!"
    - ""
    - "{action}"
  actions:
    available: "<bold><yellow>→ CLICK to Claim</yellow></bold>"
    cooldown: "<bold><gold>→ WAIT {remaining}</gold></bold>"
    locked: "<bold><red>→ LOCKED</red></bold>"

admin_gui:
  title: "<dark_gray>Kits Admin"
  size_rows: 6

preview:
  title: "<dark_gray>Preview: <aqua>{kit}"
  size_rows: 6

editor:
  title: "<dark_gray>Edit Kit: <aqua>{kit}"
  size_rows: 6

sounds:
  enabled: true
  volume: 0.8
  pitch: 1.0
  claim: entity.player.levelup
  cooldown: block.note_block.bass
  locked: entity.villager.no
  no_space: entity.villager.no
  empty: block.note_block.bass
  admin: ui.button.click

database:
  enabled: false
  host: "localhost"
  port: 3306
  database: "kits"
  username: "root"
  password: ""
  pool_size: 10

clear_inventory_before_claim: true

defaults:
  cooldown_seconds: 900
  rarity_stars: 5
  permission: "kitsbypriyme.claim.{kit}"
  display_material: LIGHT_BLUE_SHULKER_BOX
  description:
    - "<gray>Description"

format:
  star_filled: "★"
  star_empty: "☆"
  no_cooldown: "None"
  time_day: "{value}d"
  time_hour: "{value}h"
  time_minute: "{value}m"
  time_second: "{value}s"
