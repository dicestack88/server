# Configuration for the random teleport command.
# Some settings may be defaulted and can be changed using the '/settpr' command in-game.
default-location: '{world}'
range: 5000
minimum-range: 1000
excluded-biomes:
  - cold_ocean
  - deep_cold_ocean
  - deep_frozen_ocean
  - deep_lukewarm_ocean
  - deep_ocean
  - deep_warm_ocean
  - frozen_ocean
  - frozen_river
  - lukewarm_ocean
  - ocean
  - river
  - warm_ocean
