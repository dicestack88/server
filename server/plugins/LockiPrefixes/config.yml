# ╔════════════════════════════════════════════════════════════════╗
# ║                    LOCKIPREFIXES CONFIG                        ║
# ╚════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════
#                         CHAT FORMAT
# ══════════════════════════════════════════════════════════════════
# Format: RANK | NAME » MESSAGE

chat:
  format: '{prefix} &7| &f{name} &7» &f{message}'


# ══════════════════════════════════════════════════════════════════
#                        TAB LIST FORMAT
# ══════════════════════════════════════════════════════════════════

tablist:
  format: '{prefix} &7| &f{name}'
  
  sorting:
    enabled: true
  
  # Animated gradient for the rank name
  animation:
    enabled: true
    speed: 5
    
    groups:
      owner: '#FF0000,#FF3366,#FF0066,#FF00FF,#FF0066,#FF3366,#FF0000'
# admin: "#FF0000,#FF5500,#FFAA00,#FF5500,#FF0000"
# vip: "#00FF00,#00FFAA,#00FFFF,#00FFAA,#00FF00"


# ══════════════════════════════════════════════════════════════════
#                          RANK FORMATS
# ══════════════════════════════════════════════════════════════════

groups:
  
  default:
    chat-format: '&#d7d7d7&l(&#bebebe&lP&#a5a5a5&ll&#8c8c8c&la&#747474&ly&#5b5b5b&le&#424242&lr&#292929&l)
      &r&f| &7{name} >> {message}'
    tablist-format: '&#d7d7d7&l(&#bebebe&lP&#a5a5a5&ll&#8c8c8c&la&#747474&ly&#5b5b5b&le&#424242&lr&#292929&l)
      &r&f| &7{name}'
    priority: 0
  
  vip:
    chat-format: '&a&lVIP &7| &f{name} &7» &f{message}'
    tablist-format: '&a&lVIP &7| &f{name}'
    rank-tag: VIP
    priority: 10
  
  mvp:
    chat-format: '&b&lMVP &7| &f{name} &7» &f{message}'
    tablist-format: '&b&lMVP &7| &f{name}'
    rank-tag: MVP
    priority: 20
  
  helper:
    chat-format: '&e&lHelper &7| &f{name} &7» &f{message}'
    tablist-format: '&e&lHelper &7| &f{name}'
    rank-tag: Helper
    priority: 50
  
  moderator:
    chat-format: '&#0bbed5&l(M&#16ded3&lO&#21fdd1&lD)&r &b{name}&r: {message}'
    tablist-format: '&#0bbed5&l(M&#16ded3&lO&#21fdd1&lD)&r &b{name}'
    rank-tag: Mod
    priority: 60
  
  admin:
    chat-format: '&c&lAdmin &7| &f{name} &7» &f{message}'
    tablist-format: '&c&lAdmin &7| &f{name}'
    rank-tag: Admin
    priority: 80
  
  owner:
    chat-format: '&#2e23f1&l(&#4d25db&lO&#6d27c5&lw&#8c29af&ln&#ab2b98&le&#cb2d82&lr&#ea2f6c&l)
      &r&f| &c&l{name} &r&f>> {message}'
    tablist-format: '&#2e23f1&l(&#4d25db&lO&#6d27c5&lw&#8c29af&ln&#ab2b98&le&#cb2d82&lr&#ea2f6c&l)
      &r&f| &c&l{name}'
    rank-tag: Owner
    priority: 100


# ══════════════════════════════════════════════════════════════════
#                        SETTINGS
# ══════════════════════════════════════════════════════════════════

settings:
  default-username-color: '&7'
  default-message-color: '&f'
