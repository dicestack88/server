# WorldGuardExtraFlagsPlus Messages Configuration
# This file is located in the WorldGuard plugin folder
# You can customize all messages shown to players here

# IMPORTANT: Empty String = Disabled Message
# If you set a message to "" (empty string), that message will be disabled
# and no message will be sent to the player. This is useful if you want to
# silence certain messages while keeping others active.

# Example:
#   disable-completely-blocked: ""  # This will disable the blocked item message

# Messages are cached on plugin load for better performance.
# Use /wg reload or /wgefp reload (or /wgefplus reload or /worldguardextraflagsplus reload) to reload messages without restarting the server.

# Placeholders:
#   {required}   - The required level/threshold value
#   {current}    - The player's current level/value
#   {item}       - The item name that was blocked
#   {permission} - The permission node required to enter / blocked from entering

# Message Cooldown:
#   Prevents message spam by adding a cooldown between messages sent to the same player.
#   Set to 0 to disable cooldown (messages will always be sent).
#   Default: 2 seconds

# Message cooldown in seconds
# Prevents message spam by adding a cooldown between messages sent to the same player
# Set to 0 to disable cooldown (messages will always be sent)
# Default: 2 seconds
send-message-cooldown: 2
# Entry level flags messages
entry-min-level-denied: "&c&lHey! &r&7Sorry, but your level (&8{current}&7/&8{required}&7) is too low to enter this area."
# Entry level flags messages
entry-max-level-denied: "&c&lHey! &r&7Sorry, but your level (&8{current}&7/&8{required}&7) is too high to enter this area."
# Entry permission flag messages
entry-permission-denied: "&c&lHey! &r&7Sorry, but you do not have the required permission (&8{permission}&7) to enter this area."
# Entry deny permission flag messages
entry-deny-permission-denied: "&c&lHey! &r&7Sorry, but you can't enter this area with the permission (&8{permission}&7)."
# Disable completely flag message
disable-completely-blocked: '&c&lHey! &r&7Sorry, but you can''t use &f{item} &7here!'
# Disable throw flag — egg, snowball, ender pearl, experience bottle (see ThrowableItemFlag)
disable-throw-blocked: '&c&lHey! &r&7Sorry, but you can''t throw &f{item} &7here!'
# Permit workbenches flag message
permit-workbenches-blocked: "&c&lHey! &r&7Sorry, but you can't use &f{workbench}&7 here!"
# Inventory craft flag message
inventory-craft-blocked: "&c&lHey! &r&7Sorry, but you can't craft items in your inventory here!"
# Ender chest access flag message
enderchest-access-denied: '&c&lHey! &r&7Sorry, but you can''t open ender chests here!'
# WorldEdit / FAWE denied by region worldedit flag
worldedit-denied: "&c&lHey! &r&7Sorry, but you cannot use WorldEdit here (worldedit flag)."
# Godmode disabled message (extra plugins and worldguard)
godmode-disabled: '&c&lHey! &r&7Sorry, but god mode is disabled in this region!'
# Message shown when player tries to interact with block they're standing on
# Helps players understand why bucket interactions fail when standing on water/lava
standing-on-block-interaction: "&c&lHey! &r&7Sorry, but you need to move slightly off the block to interact with it!"
# Player count limit denied message
player-count-limit-denied: "&c&lHey! &r&7Sorry, but this region is full! Maximum players: &f{limit}"
